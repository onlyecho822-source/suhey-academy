name: Echo Heartbeat

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Genome (DNA Rules)
        run: python genome.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Metabolism (Event Processor)
        run: python metabolism.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Heartbeat (Health Monitor)
        run: python heartbeat.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Update Nexus Map
        run: |
          if [ -f nexus.py ]; then
            python nexus.py --update-local || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit biology updates
        run: |
          git config user.name "echo-heartbeat[bot]"
          git config user.email "heartbeat@echo-universe.ai"
          git add .echo/ coordination_log.jsonl || true
          git diff --cached --quiet || git commit -m "heartbeat: biology update [manus-ai] [skip ci]"
          git push || true
