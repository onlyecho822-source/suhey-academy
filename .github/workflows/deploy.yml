name: Site Verify

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify site files
        run: |
          echo "=== Suhey Academy File Check ==="
          for f in index.html netlify.toml; do
            if [ -f "$f" ]; then
              size=$(wc -c < "$f")
              echo "OK: $f ($size bytes)"
            else
              echo "MISSING: $f"
            fi
          done
          echo "=== Placeholder Check ==="
          count=$(grep -c 'YOUR_' index.html 2>/dev/null || echo 0)
          echo "Unfilled placeholders: $count"
          echo "=== Done ==="
