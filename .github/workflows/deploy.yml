name: Verify Files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify HTML Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          test -f index.html && echo "OK: index.html" || (echo "MISSING: index.html" && exit 1)
          test -f suhey_podcast.html && echo "OK: suhey_podcast.html" || echo "WARN: suhey_podcast.html missing"
          test -f suhey_upload.html && echo "OK: suhey_upload.html" || echo "WARN: suhey_upload.html missing"
          test -f netlify.toml && echo "OK: netlify.toml" || echo "WARN: netlify.toml missing"
          echo ""
          echo "File sizes:"
          wc -c index.html suhey_podcast.html suhey_upload.html 2>/dev/null || true
          echo ""
          echo "Deploy route: Netlify GitHub App (no secrets required)"
          echo "Connect at: app.netlify.com -> Add new site -> Import from Git"
